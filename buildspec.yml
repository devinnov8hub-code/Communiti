version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
  pre_build:
    commands:
      - npm ci
  build:
    commands:
      - npm run build

# CodeDeploy needs appspec.yml at the root of the artifact, plus the build and the
# script it runs.
artifacts:
  files:
    - appspec.yml
    - dist/**/*
    - scripts/deploy.sh

cache:
  paths:
    - /root/.npm/**/*
